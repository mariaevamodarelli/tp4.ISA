name: pipeline

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - run: npm ci
      # Pruebas automáticas: la lógica sigue funcionando
      - run: npm test
      # SCA: vulnerabilidades conocidas en las librerías
      - run: npm audit --audit-level=high
      # SAST: patrones peligrosos en el código fuente
      - run: pip install semgrep
      - run: semgrep scan --config auto --error
      # Detección de secretos en el código y el historial
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Reto 2: escanear el Dockerfile y la configuración con Trivy (IaC / misconfiguración)
      - run: docker run --rm -v "$PWD":/src aquasec/trivy:0.75.0 config --exit-code 1 --severity HIGH,CRITICAL /src
      # Reto 3: DAST, probar la app en ejecución con OWASP ZAP (escaneo base)
      - run: |
          node app.js &
          timeout 30 bash -c 'until curl -fsS "localhost:3000/total?p=10&c=2" > /dev/null; do sleep 1; done'
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://localhost:3000/total?p=10&c=2"
          allow_issue_writing: false
          fail_action: true
          rules_file_name: ".zap/rules.tsv"
